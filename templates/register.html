<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donor Registration</title>
  <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
  <style>
    body {
      background: #f6f7fb;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 0;
    }
    .solid-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(60,64,67,.10);
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 32px 32px 32px;
      border: 1.5px solid #e4e6eb;
    }
    .form-title {
      font-size: 2rem;
      font-weight: 700;
      color: #d7263d;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .form-desc {
      font-size: 1.05rem;
      color: #5f6368;
      margin-bottom: 28px;
    }
    .form-label {
      font-size: 1.08rem;
      color: #22223b;
      font-weight: 500;
      margin-bottom: 6px;
      display: block;
    }
    .form-control, .form-select {
      border-radius: 7px;
      border: 1.5px solid #dadce0;
      font-size: 1.05rem;
      padding: 10px 14px;
      background: #f6f7fb;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus, .form-select:focus {
      border-color: #d7263d;
      box-shadow: 0 0 0 2px rgba(215,38,61,0.10);
      background: #fff;
    }
    .form-section {
      margin-bottom: 26px;
    }
    .btn-solid {
      background-color: #d7263d;
      color: #fff;
      font-weight: 600;
      border-radius: 7px;
      padding: 12px 0;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      border: none;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(215,38,61,0.10);
    }
    .btn-solid:hover {
      background-color: #b71c2b;
    }
    @media (max-width: 600px) {
      .solid-card {
        padding: 22px 4vw;
      }
      .form-title {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="solid-card">
    <div class="form-title">Donor Registration</div>
    <div class="form-desc">Please fill out this form to register as a blood donor.</div>
    <form action="/register_donor" method="POST" autocomplete="off">
      <div class="form-section">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" name="name" id="name" required />
      </div>

      <div class="form-section">
        <label for="age" class="form-label">Age</label>
        <input type="number" class="form-control" name="age" id="age" min="18" required />

        <label for="gender" class="form-label">Gender</label>
        <select name="gender" class="form-select" id="gender" required>
          <option value="" disabled selected>Select your gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-section">
        <label for="blood_group" class="form-label">Blood Group</label>
        <select class="form-select" name="blood_group" id="blood_group" required>
          <option value="" disabled selected>Select your blood group</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="Not aware">I don't know</option>
        </select>
      </div>

      <div class="form-section">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="text" class="form-control" name="phone" id="phone" value="+91" oninput="addCountryCode()" required />
      </div>

      <div class="form-section">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" class="form-control" name="dob" id="dob" required />
      </div>

      <div class="form-section">
        <label for="location" class="form-label">Location</label>
        <input type="text" class="form-control" name="location" id="location" required />
      </div>

      <button type="submit" class="btn btn-solid w-100 mt-2">Register</button>
    </form>
  </div>
  <script src="/static/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js">
    
    function addCountryCode() {
      const input = document.getElementById("phone");
      const prefix = "+91";
      if (!input.value.startsWith(prefix)) {
        input.value = prefix;
      }
    }
  </script>
</body>
</html>
