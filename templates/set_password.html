<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Set Password | IVR Donor System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe5ec 0%, #f9c6d4 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .setpw-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(60,64,67,.10);
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
      padding: 38px 32px 32px 32px;
      border: 1.5px solid #e4e6eb;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
      z-index: 1;
    }
    .logo {
      display: block;
      margin: 0 auto 18px auto;
      height: 48px;
    }
    .form-title {
      font-weight: 700;
      margin-bottom: 22px;
      text-align: center;
      font-size: 1.6rem;
      color: #d7263d;
      letter-spacing: -0.5px;
    }
    .form-label {
      font-weight: 500;
      color: #22223b;
      margin-bottom: 6px;
    }
    .form-control {
      border-radius: 7px;
      border: 1.5px solid #dadce0;
      font-size: 1.05rem;
      padding: 12px 14px;
      background: #f6f7fb;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 18px;
    }
    .form-control:focus {
      border-color: #d7263d;
      box-shadow: 0 0 0 2px rgba(215,38,61,0.10);
      background: #fff;
    }
    .btn-solid {
      background-color: #d7263d;
      color: #fff;
      font-weight: 600;
      border-radius: 7px;
      padding: 13px 0;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      border: none;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(215,38,61,0.10);
      margin-top: 10px;
    }
    .btn-solid:hover {
      background-color: #b71c2b;
    }
    .setpw-msg {
      min-height: 24px;
      margin-top: 14px;
      text-align: center;
      font-weight: 500;
    }
    .setpw-msg.error { color: #d7263d; }
    .setpw-msg.success { color: #198754; }
    @media (max-width: 600px) {
      .setpw-card {
        padding: 18px 4vw 18px 4vw;
      }
      .form-title {
        font-size: 1.15rem;
        margin-bottom: 18px;
      }
      .logo {
        height: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="setpw-card">
    <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo" alt="Logo">
    <div class="form-title">Set Your Password</div>
    <form id="setpw-form" autocomplete="off">
      <div class="mb-3">
        <label for="password" class="form-label">New Password</label>
        <input type="password" name="password" class="form-control" id="password" placeholder="Enter new password" required autocomplete="new-password">
      </div>
      <div class="mb-4">
        <label for="confirm" class="form-label">Confirm Password</label>
        <input type="password" name="confirm" class="form-control" id="confirm" placeholder="Re-enter new password" required autocomplete="new-password">
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-solid">Set Password</button>
      </div>
      <div id="setpw-msg" class="setpw-msg"></div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>

    // Supabase crendentials
    const SUPABASE_URL = "{{ supabase_url }}";
    const SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Parse query params
    function getQueryParams() {
      const params = {};
      window.location.search.substring(1).split("&").forEach(function(part) {
        if (!part) return;
        let item = part.split("=");
        params[decodeURIComponent(item[0])] = decodeURIComponent(item[1]);
      });
      return params;
    }

    // On load: exchange token for session if present
    window.addEventListener('DOMContentLoaded', async function() {
      const params = getQueryParams();
      if (params.access_token && params.type) {
        //Exchange token for session
        try {
          await supabase.auth.setSession({
            access_token: params.access_token,
            refresh_token: params.refresh_token || ""
          });
        } catch (e) {
          document.getElementById('setpw-msg').textContent = "Invalid or expired link. Please request a new invite.";
          document.getElementById('setpw-msg').className = "setpw-msg error";
        }
      }
    });



    // Handle password set form
    document.getElementById('setpw-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const msg = document.getElementById('setpw-msg');
      msg.textContent = "";
      msg.className = "setpw-msg";

      if (pw.length < 6) {
        msg.textContent = "Password must be at least 6 characters.";
        msg.className += " error";
        return;
      }
      if (pw !== confirm) {
        msg.textContent = "Passwords do not match.";
        msg.className += " error";
        return;
      }

      msg.textContent = "Setting password...";
      try {
        const { data, error } = await supabase.auth.updateUser({ password: pw });
        if (error) {
          msg.textContent = error.message || "Failed to set password.";
          msg.className += " error";
        } else {
          msg.textContent = "Password set! Redirecting to login...";
          msg.className += " success";
          setTimeout(() => { window.location.href = "/login"; }, 1800);
        }
      } catch (e) {
        msg.textContent = "An error occurred. Please try again.";
        msg.className += " error";
      }
    });
  </script>
</body>
</html>
