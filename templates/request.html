<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blood Request | IVR Donor System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe5ec 0%, #f9c6d4 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    .logo {
      height: 48px;
      margin: 24px auto 8px auto;
      display: block;
    }
    .logout-btn {
      position: absolute;
      top: 24px;
      right: 32px;
    }
    @media (max-width: 600px) {
      .logo {
        height: 32px;
        margin-top: 12px;
      }
      .logout-btn {
        top: 12px;
        right: 10px;
      }
    }
  </style>
</head>
<body>
  <a href="/home" class="btn btn-outline-danger logout-btn">Logout</a>
  <img src="/static/img/logo.png" alt="Logo" class="logo">

  <div class="container py-4">
    <h2 class="mb-4 text-center" style="color:#d7263d; font-weight:bold;">Request Blood Donation</h2>

    <!-- Blood Group Selection -->
    <div class="row mb-4 justify-content-center align-items-end">
      <div class="col-md-4 col-8">
        <label for="bloodGroup" class="form-label">Select Blood Group</label>
        <select id="bloodGroup" class="form-select">
          <option selected disabled>Select Blood Group</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>
      </div>
      <div class="col-md-2 col-4">
        <button class="btn btn-success w-100" onclick="triggerCall()">Trigger Calls</button>
      </div>
    </div>

    <!-- Confirmed Donors Table -->
    <h5 class="mb-2 mt-3 text-center">Confirmed Donors</h5>
    <div class="table-responsive">
      <table class="table table-bordered table-striped align-middle" id="confirmedTable">
        <thead class="table-danger">
          <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Blood Group</th>
            <th>Phone</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows will be added here -->
        </tbody>
      </table>
    </div>

    <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">
      <button class="btn btn-danger" onclick="finalizeRequest()">Finalize Request</button>
      <a href="/dashboard" class="btn btn-outline-secondary">Back to Dashboard</a>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.4/dist/umd/supabase.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="/static/bootstrap/js/bootstrap.bundle.min.js"></script>

  <script>
    let supabase;

    async function initializeSupabase() {
      const response = await fetch('/supabase-config');
      const config = await response.json();
      supabase = window.supabase.createClient(config.url, config.anon);

      // Initial load
      await loadConfirmedDonors();

      // Subscribe to real-time inserts
      supabase.channel('realtime:confirmed_donors')
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'confirmed_donors',
        }, payload => {
          alert(`✅ New donor confirmed!! : ${payload.new.Name}`);
          loadConfirmedDonors();
        })
        .subscribe();
    }

    async function loadConfirmedDonors() {
      const { data, error } = await supabase.from('confirmed_donors').select('*');
      const tbody = document.querySelector('#confirmedTable tbody');
      tbody.innerHTML = '';
      (data || []).forEach(donor => {
        const row = `
          <tr>
            <td>${donor.Name}</td>
            <td>${donor.Age}</td>
            <td>${donor.Blood_Group}</td>
            <td>${donor.Phone_Number}</td>
            <td>${donor.Location || '-'}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    async function triggerCall() {
      const group = document.getElementById('bloodGroup').value;
      if (!group) {
        alert("Please select a blood group!");
        return;
      }
      const res = await fetch('/call_donors', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ blood_group: group })
      });
      const result = await res.json();
      alert(result.status || 'Calls initiated!');
    }

    async function finalizeRequest() {
      const btn = document.querySelector('button.btn.btn-danger');
      btn.disabled = true;
      btn.innerText = "Finalizing...";
      try {
        if (!confirm("Are you sure you want to finalize this request? This will clear the confirmed donors list and save to history.")) {
          btn.disabled = false;
          btn.innerText = "Finalize Request";
          return;
        }
        const res = await fetch('/finalize_request', { method: 'POST' });
        if (res.status === 204) {
          alert("✅ Request finalized and saved to history.");
          loadConfirmedDonors();
        } else {
          alert("❌ Finalization failed.");
        }
      } catch (error) {
        alert("🚫 Network error. Try again.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Finalize Request";
      }
    }

    // Initialize Supabase
    initializeSupabase();
  </script>
</body>
</html>
