<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | IVR Donor System</title>
  <link href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe5ec 0%, #f9c6d4 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(60,64,67,.10);
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 32px 32px 32px;
      border: 1.5px solid #e4e6eb;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
      z-index: 1;
    }
    .logo {
      display: block;
      margin: 0 auto 18px auto;
      height: 48px;
    }
    .form-title {
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
      font-size: 2rem;
      color: #d7263d;
      letter-spacing: -0.5px;
    }
    .form-label {
      font-weight: 500;
      color: #22223b;
      margin-bottom: 6px;
    }
    .form-control {
      border-radius: 7px;
      border: 1.5px solid #dadce0;
      font-size: 1.05rem;
      padding: 12px 14px;
      background: #f6f7fb;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 18px;
    }
    .form-control:focus {
      border-color: #d7263d;
      box-shadow: 0 0 0 2px rgba(215,38,61,0.10);
      background: #fff;
    }
    .btn-solid {
      background-color: #d7263d;
      color: #fff;
      font-weight: 600;
      border-radius: 7px;
      padding: 13px 0;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      border: none;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(215,38,61,0.10);
      margin-top: 10px;
    }
    .btn-solid:hover {
      background-color: #b71c2b;
    }
    .btn-solid-outline {
      background: #fff0f3;
      color: #d7263d;
      font-weight: 600;
      border-radius: 7px;
      padding: 13px 0;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      border: 1.5px solid #d7263d;
      transition: background 0.2s, color 0.2s;
      box-shadow: 0 2px 8px rgba(215,38,61,0.10);
    }
    .btn-solid-outline:hover {
      background: #d7263d;
      color: #fff;
    }
    .login-msg {
      min-height: 24px;
      margin-top: 14px;
      text-align: center;
      color: #d7263d;
      font-weight: 500;
    }
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.98rem;
      color: #b71c2b;
      text-decoration: underline;
      cursor: pointer;
      margin-top: -12px;
      margin-bottom: 8px;
    }
    /* Floating reset password window */
    .reset-float-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(60,64,67,0.12);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .reset-float-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 32px rgba(60,64,67,.18);
      max-width: 340px;
      width: 94vw;
      padding: 32px 20px 22px 20px;
      position: relative;
      z-index: 1001;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      animation: floatIn .22s cubic-bezier(.3,.8,.4,1.2);
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px);}
      to   { opacity: 1; transform: translateY(0);}
    }
    .reset-title {
      font-weight: 600;
      color: #d7263d;
      font-size: 1.18rem;
      margin-bottom: 6px;
      text-align: center;
    }
    .reset-btn-row {
      display: flex;
      gap: 1rem;
      margin-top: 10px;
      justify-content: flex-end;
    }
    .reset-btn-row .btn {
      min-width: 100px;
      margin-top: 0;
    }
    .alert-float {
      position: fixed;
      top: 38px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1050;
      min-width: 260px;
      max-width: 90vw;
      text-align: center;
      display: none;
    }
    @media (max-width: 600px) {
      .login-card {
        padding: 22px 4vw 22px 4vw;
      }
      .form-title {
        font-size: 1.3rem;
        margin-bottom: 18px;
      }
      .logo {
        height: 36px;
      }
      .reset-float-card {
        padding: 18px 6vw 14px 6vw;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo" alt="Logo">
    <div class="form-title">Admin Login</div>
    <form id="login-form" autocomplete="off">
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" name="email" class="form-control" id="email" placeholder="admin@example.com" required autocomplete="username">
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <span class="forgot-link" onclick="showResetFloat()">Forgot password?</span>
      <div class="d-grid">
        <button type="submit" class="btn btn-solid">Login</button>
      </div>
      <div id="login-msg" class="login-msg"></div>
    </form>
  </div>

  <!-- Floating Reset Password Window -->
  <div class="reset-float-bg" id="resetFloatBg">
    <div class="reset-float-card">
      <div class="reset-title">Reset Password</div>
      <label for="reset-email" class="form-label mb-1">Enter your email address</label>
      <input type="email" class="form-control" id="reset-email" placeholder="you@example.com" required>
      <div class="reset-btn-row">
        <button class="btn btn-solid" onclick="sendResetLink()">Send Reset Link</button>
        <button class="btn btn-solid-outline" onclick="hideResetFloat()">Cancel</button>
      </div>
      <div id="reset-msg" class="login-msg" style="color:#198754; margin-top: 8px;"></div>
    </div>
  </div>

  <!-- Floating Success Alert -->
  <div class="alert alert-success alert-float" id="resetAlert">
    Reset link sent! Please check your email.
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>

    console.log("Script loaded");

    
    const SUPABASE_URL = "{{ supabase_url }}";
    const SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Login logic
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      document.getElementById('login-msg').textContent = "Logging in...";
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      console.log('Login result:', data, error); // added extra to check for the error 

      if (error) {
        document.getElementById('login-msg').textContent = error.message || "Login failed";
      } else {
        document.getElementById('login-msg').textContent = "";
        window.location.href = "/dashboard";
      }
    });

    // Floating reset password window logic
    function showResetFloat() {
      document.getElementById('reset-email').value = '';
      document.getElementById('reset-msg').textContent = '';
      document.getElementById('resetFloatBg').style.display = 'flex';
      setTimeout(() => { document.getElementById('reset-email').focus(); }, 100);
    }
    function hideResetFloat() {
      document.getElementById('resetFloatBg').style.display = 'none';
    }

    // Send reset link and show alert
    async function sendResetLink() {
      const email = document.getElementById('reset-email').value.trim();
      const msg = document.getElementById('reset-msg');
      if (!email) {
        msg.textContent = "Please enter your email.";
        return;
      }
      msg.textContent = "Sending reset link...";
      const { data, error } = await supabase.auth.resetPasswordForEmail(email);
      if (error) {
        msg.style.color = "#d7263d";
        msg.textContent = error.message || "Failed to send reset link.";
      } else {
        msg.textContent = "";
        hideResetFloat();
        showResetAlert();
      }
    }

    // Floating alert logic
    function showResetAlert() {
      const alertDiv = document.getElementById('resetAlert');
      alertDiv.style.display = "block";
      setTimeout(() => {
        alertDiv.style.display = "none";
      }, 3200);
    }

    // Hide reset window on ESC
    document.addEventListener('keydown', function(e) {
      if (e.key === "Escape") hideResetFloat();
    });

    // Hide reset window if clicking outside the card
    document.getElementById('resetFloatBg').addEventListener('click', function(e) {
      if (e.target === this) hideResetFloat();
    });
  </script>
</body>
</html>
