name: Update Donor Ages Weekly

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3:00 AM UTC (8:30 AM IST)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Supabase client
        run: pip install supabase

      - name: Run update_ages.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_ages.py
